# Publica banco (migrações) e Edge Functions no projeto Supabase do ambiente:
#   push em `staging` -> projeto de STAGING
#   push em `main`    -> projeto de PRODUÇÃO (exige aprovação no environment "production")
#
# Segredos por environment no GitHub (Settings > Environments > staging / production):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
#   CRON_SECRET (senha da rodada diária) e, opcionais, OPEN_METEO_API_KEY e MP_* (fotos)
# Variáveis (Settings > Environments > Variables): SITE_URL, SPOT_SCOPE (all no staging, baixada na produção)
name: Supabase deploy

on:
  push:
    branches: [main, staging]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Projeto configurado?
        id: cfg
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Supabase deste ambiente ainda não configurado: deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
        if: steps.cfg.outputs.ok == 'true'
      - name: Segredos das Edge Functions
        if: steps.cfg.outputs.ok == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          SPOT_SCOPE: ${{ vars.SPOT_SCOPE }}
        run: |
          args=()
          for k in CRON_SECRET OPEN_METEO_API_KEY SITE_URL SPOT_SCOPE; do
            [ -n "${!k}" ] && args+=("$k=${!k}")
          done
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF"; fi
      - name: Migrações do banco
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Functions
        if: steps.cfg.outputs.ok == 'true'
        run: |
          supabase functions deploy create-checkout --project-ref "$PROJECT_REF"
          supabase functions deploy mp-webhook --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy mp-oauth --no-verify-jwt --project-ref "$PROJECT_REF"
          # rodada diária: protegida pelo cabeçalho x-cron-secret (não usa login)
          supabase functions deploy daily-forecast --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy push-test --project-ref "$PROJECT_REF"
