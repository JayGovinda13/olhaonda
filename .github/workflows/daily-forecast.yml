# Rodada diária do fórum e dos alertas (Edge Function daily-forecast) (projeto Supabase único, environment production):
#   O horário certo (05:13 e de 3 em 3 h) é do pg_cron no Supabase (migration 20261116000000). Este workflow é só reserva/manual.
#   05:13 (horário de Brasília): publica o resumo da previsão no fórum de cada pico e confere os alertas
#   a cada 3 h (08:43, 11:43, 14:43, 17:43, 20:43, 23:43, 02:43): só os alertas, com a previsão atualizada.
#   Cada conferência manda aviso (site, push e WhatsApp) só se algo mudou: entrou, mudou, saiu ou voltou.
#
# Segredos no environment "production" do GitHub: SUPABASE_PROJECT_REF e CRON_SECRET
# (o mesmo valor configurado na função: supabase secrets set CRON_SECRET=...).
name: Previsão diária no fórum

on:
  schedule:
    - cron: '43 13 * * *' # reserva, só avisos (o horário principal é do pg_cron no Supabase, ver docs/producao-fechada.md)
  workflow_dispatch:
    inputs:
      only:
        description: 'Deixe vazio para rodar tudo (fórum + avisos) ou escolha "alerts" para só conferir os avisos'
        required: false
        default: ''
        type: choice
        options: ['', alerts]

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Chamar daily-forecast
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ONLY: ${{ inputs.only || (github.event_name == 'schedule' && 'alerts' || '') }}
        run: |
          if [ -z "$REF" ] || [ -z "$CRON_SECRET" ]; then echo "::notice::Supabase ainda não configurado (SUPABASE_PROJECT_REF e CRON_SECRET): nada a fazer."; exit 0; fi
          url="https://$REF.supabase.co/functions/v1/daily-forecast"
          [ -n "$ONLY" ] && url="$url?only=$ONLY"
          curl -sS --fail-with-body --max-time 400 -X POST -H "x-cron-secret: $CRON_SECRET" "$url"
