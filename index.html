<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5E6D3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16111B" media="(prefers-color-scheme: dark)" />
    <script>
      // modo claro/noturno antes de pintar a página (evita piscar). Mesma chave do MUI (useColorScheme).
      try {
        var m = localStorage.getItem('mui-mode') || 'system'
        var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(d ? 'dark' : 'light')
      } catch (e) {}
    </script>
    <meta name="description" content="OlhaOnda: previsão de ondas para surf e bodyboard no litoral brasileiro. Swell, vento, maré e temperatura da água." />
    <title>OlhaOnda · Previsão de ondas</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>OlhaOnda · Previsão de ondas</h1>
      <p>
        Previsão de ondas para surf e bodyboard no litoral brasileiro: altura e período do swell, direção em graus, força da
        onda, vento terral ou maral, maré no padrão da Marinha e tempo, hora a hora. Ative o JavaScript para ver a previsão.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
